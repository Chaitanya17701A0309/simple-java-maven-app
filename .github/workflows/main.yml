name: DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  devsecops-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 🛡️ PILLAR 1: CHECKSTYLE (Code Quality)
      # Scans for messy code, bad naming, and formatting issues.
      - name: Run Checkstyle
        run: mvn checkstyle:check --no-transfer-progress
        continue-on-error: true # Don't stop the build if code is just "messy"

      # 🛡️ PILLAR 2: JACOCO (Test Coverage)
      # Measures how much of your code is actually tested.
      # Note: This runs your unit tests automatically.
      - name: Run JaCoCo Coverage
        run: mvn test jacoco:report --no-transfer-progress

      # 🛡️ PILLAR 3: OWASP DEPENDENCY CHECK (SCA)
      # Scans your libraries (dependencies) for known security vulnerabilities.
      - name: Run OWASP Dependency Scan
        run: mvn dependency-check:check -DfailOnError=false --no-transfer-progress

      # 🛡️ PILLAR 4: CYCLONEDX (SBOM)
      # Generates a Software Bill of Materials (Digital Receipt).
      - name: Generate CycloneDX SBOM
        run: mvn cyclonedx:makeBom --no-transfer-progress

      # 🚀 ARTIFACT UPLOAD: Downloadable Reports
      # This step collects all 4 reports into one ZIP file.
      - name: Upload Audit Reports
        if: always() # Ensure reports are uploaded even if a check fails
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-audit-reports
          path: |
            target/checkstyle-result.xml
            target/site/jacoco/
            target/dependency-check-report.html
            target/bom.json


  # JOB 1: SECRETS SCANNING
  # This ensures you haven't accidentally pushed passwords or keys
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important for scanning history
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true # Don't stop for now, just report

  # JOB 2: BUILD AND SECURITY ANALYSIS
  build-and-security:
    needs: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' # Matches your pom.xml
          distribution: 'temurin'
          cache: 'maven'

      # STEP: BUILD + CHECKSTYLE + OWASP + SBOM
      # These run because we configured them in your pom.xml
      - name: Maven Build and Scans
        run: mvn clean verify -DskipTests --no-transfer-progress

      # STEP: VULNERABILITY SCAN (Trivy)
      # Scans the filesystem for any hidden risks
      - name: Trivy Project Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      # STEP: UPLOAD SECURITY REPORTS
      # This allows you to download the audit files
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-bundle
          path: |
            target/dependency-check-report.html
            target/bom.json
