name: DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # LAYER 1: SECRETS SCANNING
  # We do this first because if there's a password in the code, we stop immediately.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true # Report but don't kill the build yet

  # LAYER 2: THE MAIN AUDIT & BUILD
  # This job does all the Java work in ONE place to save time.
  devsecops-build:
    needs: secrets-scan # Only starts if secrets-scan finishes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # We run ONE Maven command to trigger Checkstyle, JaCoCo, OWASP, and SBOM.
      - name: Run Maven DevSecOps Stack
        run: mvn clean verify --no-transfer-progress

      # VULNERABILITY SCAN (Trivy)
      # We run this after the build to check the project filesystem
      - name: Trivy Project Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      # ARTIFACT UPLOAD
      # Collect all reports into one single ZIP file
      - name: Upload Security & Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-audit-reports
          path: |
            target/checkstyle-result.xml
            target/site/jacoco/
            target/dependency-check-report.html
            target/bom.json
